<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AllinA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{ /* светлая — её розовая */
  --bg:#fff6f8; --bg2:#ffe9ef; --tx:#2b1b22; --hint:#9a7f89; --card:#ffffff;
  --acc:#e2557f; --acc2:#f7a8c0; --hastx:#5a1a2e; --ok:#3aa76d; --okbg:rgba(58,167,109,.08); --warn:#d9822b; --bad:#c0504d;
  --line:rgba(150,100,120,.18); --shadow:rgba(120,60,80,.08); --axis:#e8d3da;
  color-scheme:light;
}
:root[data-theme="dark"]{ /* тёмная — сливовая */
  --bg:#1c1016; --bg2:#35202b; --tx:#f8e8ee; --hint:#b893a3; --card:#28171f;
  --acc:#f06b95; --acc2:#7d3452; --hastx:#ffe3ec; --ok:#4cc386; --okbg:rgba(76,195,134,.12); --warn:#f0a050; --bad:#ef7a76;
  --line:rgba(247,168,192,.16); --shadow:rgba(0,0,0,.35); --axis:#4a2c3a;
  color-scheme:dark;
}
:root[data-theme="tg"]{ /* цвета темы Telegram */
  --bg:var(--tg-theme-bg-color,#fff6f8); --bg2:rgba(128,128,128,.16); --tx:var(--tg-theme-text-color,#2b1b22);
  --hint:var(--tg-theme-hint-color,#9a7f89); --card:var(--tg-theme-secondary-bg-color,#ffffff);
  --acc2:#f7a8c0; --hastx:#5a1a2e; --axis:var(--tg-theme-hint-color,#e8d3da);
}
.thm{display:none;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 0}
.thm.open{display:grid}
.thm button{padding:7px 0;font-size:12px;border-radius:10px}
.thm button.on{background:var(--acc);color:#fff}
#thbtn{background:transparent;padding:2px 4px;font-size:18px;align-self:center}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:0 0 calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 0}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:22px;letter-spacing:.5px;color:var(--acc)}
.brand span{color:var(--hint);font-size:13px;white-space:nowrap}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
#tabs button{white-space:nowrap;padding:9px 0;font-size:12.5px;border-radius:10px}
#tabs button.on{background:var(--acc);color:#fff}
.sp{flex:1}
main{padding:12px 16px}
button{font:inherit;border:0;border-radius:12px;padding:10px 12px;background:var(--bg2);color:var(--tx);cursor:pointer}
button:disabled{opacity:.35}
button.pri{background:var(--acc);color:#fff}
button.ghost{background:transparent;color:var(--acc);padding:6px 8px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px var(--shadow)}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--hint);font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 12px}
.seg button{padding:8px 0;font-size:12px;border-radius:10px;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
.seg.s3{grid-template-columns:repeat(3,1fr)}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13px;display:none;z-index:30;max-width:90%}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--hint);padding:4px 22px}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mhead button{padding:4px 14px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--hint)}
.cal button{padding:0;height:38px;border-radius:10px;font-size:14px;background:transparent}
.cal button.has{background:var(--acc2);color:var(--hastx);font-weight:600}
.cal button.today{outline:1.5px solid var(--acc)}
.cal button.on{background:var(--acc);color:#fff}
.cal button.out{visibility:hidden}
.ses{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.exl{padding:6px 0;border-bottom:1px solid var(--line)} .exl:last-child{border-bottom:0}
.exl .n{font-weight:600;font-size:14px} .exl .v{font-size:14px} .nt{font-size:12.5px;color:var(--hint);font-style:italic}
svg.chart{width:100%;height:auto;display:block;margin:8px 0 2px;touch-action:manipulation}
.pick,.best{background:var(--bg2);border-radius:12px;padding:10px;margin:8px 0}
.best .top{font-size:13.5px;margin-top:4px}
ul.pl{list-style:none;margin:6px 0 0;padding:0}
ul.pl li{display:grid;grid-template-columns:68px 1fr auto;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
ul.pl li.on{background:var(--bg2);border-radius:8px}
details summary{cursor:pointer;color:var(--acc);font-size:13px;margin-top:6px;list-style:none}
details summary::-webkit-details-marker{display:none}
.fex{border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;background:var(--card)}
.exc .n{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.exc h3{margin:0}
.hint{font-size:12.5px;color:var(--hint);margin:4px 0 6px}
.hint.up{color:var(--ok)} .hint.warn{color:var(--warn)}
.sets{width:100%;border-collapse:collapse;margin-top:6px}
.sets td{padding:3px 2px;text-align:center}
.sets td:first-child{width:28px;color:var(--hint);font-size:13px}
.sets input{text-align:center;padding:8px 4px}
.sets tr.done input{border-color:var(--ok);background:var(--okbg)}
.sets td:last-child{width:50px}
.sets td.rc{width:21%}
.chk{width:44px;height:38px;border-radius:10px;background:var(--bg2);font-size:18px;padding:0}
tr.done .chk{background:var(--ok);color:#fff}
.x td{color:var(--hint);font-size:12px}
.lbl{display:block;font-size:12px;color:var(--hint);margin:6px 0 2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tpl button{width:100%;padding:14px;font-size:16px;font-weight:600}
.tpl button div{font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.sum div{background:var(--bg2);border-radius:12px;padding:10px}
.sum b{display:block;font-size:20px}
.foot{display:flex;align-items:center;gap:2px;margin-top:6px;flex-wrap:wrap}
.foot button{background:transparent;color:var(--acc);padding:6px 4px;font-size:12.5px}
.foot .sp{flex:1}
.fex .n{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.fex .n>span:first-child{font-weight:600;font-size:14.5px}
.fex .n small{color:var(--hint);font-weight:400}
.acts{display:flex;gap:3px;flex-shrink:0}
.acts button{padding:4px 8px;font-size:13px;border-radius:8px}
.phint{font-size:12.5px;margin:4px 0;padding:6px 8px;border-radius:8px;background:var(--bg2)}
.phint.ok{color:var(--ok)} .phint.warn{color:var(--warn)}
.lbls,.g{display:grid;gap:5px}
.lbls{font-size:11px;color:var(--hint);margin-top:6px}
.lbls span{text-align:center}
.g input{padding:8px 4px;text-align:center}
.g input[data-k="load"]{text-align:left;padding:8px}
.smb{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.smb button{padding:5px 9px;font-size:12px;border-radius:8px;background:transparent;color:var(--acc)}
.wcard{background:var(--bg2);border-radius:14px;padding:10px;margin:10px 0}
.wcard .wh{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.wu{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.wck{width:28px;height:28px;padding:0;border-radius:8px;background:var(--bg2);flex-shrink:0;font-size:15px}
.wck.on{background:var(--ok);color:#fff}
.wu details summary{color:var(--tx);font-size:14px;margin:4px 0 0}
.wu .wd{font-size:12.5px;color:var(--hint);white-space:pre-wrap;margin-top:4px}
.big{width:100%;padding:13px;font-size:15.5px;font-weight:600;margin-top:8px}
.kbm button{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin-bottom:6px;background:var(--bg2)}
.kbm small{display:block;color:var(--hint);font-size:12px}
.bi{margin:10px 0}
.bh2{display:flex;gap:8px;align-items:center}
.bc{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 4px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.4)}
.btr{height:6px;background:var(--bg2);border-radius:3px;margin-top:4px;position:relative}
.btr i{position:absolute;top:0;bottom:0;border-radius:3px}
ul.kbl{margin:6px 0 0;padding-left:18px} ul.kbl li{margin:4px 0;font-size:13.5px}
.mr{display:grid;grid-template-columns:1fr auto 54px;gap:4px 8px;width:100%;text-align:left;background:transparent;padding:6px 2px;border-radius:8px;align-items:center}
.mr.z{opacity:.6} .mr.on{background:var(--bg2)}
.mr .mb{grid-column:1/4;height:7px;background:var(--bg2);border-radius:4px;position:relative;overflow:hidden}
.mr .mb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.mr .mb .tg{position:absolute;top:0;bottom:0;border-left:1px dashed var(--ok);border-right:1px dashed var(--ok)}
.mr small{font-size:11px;text-align:right}
i.low{background:var(--warn)} i.ok{background:var(--ok)} i.hi{background:var(--acc)} i.free{background:var(--hint)}
small.low{color:var(--warn)} small.ok{color:var(--ok)} small.hi{color:var(--acc)} small.free{color:var(--hint)}
.mhint{background:var(--bg2);border-radius:12px;padding:10px;font-size:13px;margin-top:10px}
.mped{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin:4px 0}
.mped .tri{display:flex;gap:3px}
.mped .tri button{padding:4px 8px;font-size:12px;border-radius:8px}
.mped .tri button.on{background:var(--acc);color:#fff}
#timer{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:25;background:var(--acc);color:#fff;border-radius:16px;padding:10px 14px;display:none;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(200,60,100,.35)}
#timer b{font-size:22px;font-variant-numeric:tabular-nums}
#timer button{background:rgba(255,255,255,.22);color:#fff;padding:6px 10px;font-size:13px}
.kbig{font-size:15px;margin:6px 0 4px}.kbig b{font-size:30px;color:var(--acc)}
.fbar{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;margin:3px 0 6px}.fbar i{display:block;height:100%;background:var(--acc);border-radius:5px}.fbar i.pr{background:var(--ok)}.fbar i.over{background:var(--bad)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12.5px;color:var(--hint)}.mac b{color:var(--tx)}
.left{font-size:13.5px;margin-top:2px}
.wdots{display:flex;justify-content:space-between;margin-top:8px}.wdots span{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--hint);gap:2px}
.wdots i{font-style:normal;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg2);color:var(--hint);font-size:13px}
.wdots .ok i{background:var(--ok);color:#fff}.wdots .over i{background:var(--bad);color:#fff}.wdots .now i{background:var(--acc2);color:var(--hastx)}
.fr{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border-radius:0;border-bottom:1px solid var(--line);padding:9px 2px;font-size:14px}
.fr small{color:var(--hint);font-size:12px}
.calc{margin:8px 0;font-size:15px}
.seg.s4{grid-template-columns:repeat(4,1fr)}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
.sheet-in{background:var(--card);color:var(--tx);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.dnav2{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;margin:8px 0}.dnav2 button{padding:8px 0;font-size:18px}
.dl2{position:relative;text-align:center;font-weight:600;font-size:15px}.dl2 small{display:block;font-weight:400;color:var(--hint);font-size:12px}
.dl2 input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}
.ing{display:grid;grid-template-columns:1fr 70px auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.ing input{padding:7px 6px;text-align:center}
.seg.s2{grid-template-columns:repeat(2,1fr)}
.ldbox{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.ldpick{position:relative;display:inline-block;padding:9px 12px;border-radius:10px;background:var(--bg2);color:var(--acc);font-size:13.5px;white-space:nowrap}
.ldpick select{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}
.ldrow{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin:4px 0}.ldrow input{text-align:left!important;padding:8px!important}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{padding:5px 9px;font-size:12.5px;border-radius:999px;background:var(--bg2);color:var(--tx)}
.chip.was{background:transparent;border:1px solid var(--line);color:var(--hint)}
.chip.nx{background:var(--ok);color:#fff}
textarea{min-height:70px;resize:vertical}
</style>
</head>
<body>
<header><div class="brand"><b>AllinA</b><span>твой дневник</span><div class="sp"></div><span id="store" class="sub"></span><button id="thbtn" aria-label="тема">🎨</button></div><div class="thm" id="thm"></div><div id="tabs"></div><div id="bkbar" style="display:none"></div></header>
<main id="app"><div class="card sub">Загрузка…</div></main>
<div id="timer"><span>Отдых</span><b id="tsec">0:00</b><div class="sp"></div><button id="tplus">+30 с</button><button id="tstop">✕</button></div>
<div class="toast" id="toast"></div>
<div id="sheet" hidden><div class="sheet-in" id="sheet-b"></div></div>
<input type="file" id="scanfile" accept="image/*" capture="environment" hidden>
<nav id="nav">
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4-3.5 7.5V13H17"/></svg>Еда</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Тело</button>
  <button data-tab="gym"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Трени</button>
</nav>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ================= хранилище: облако Telegram (≤4096 символов на ключ), иначе память браузера ================= */
const TG = window.Telegram && window.Telegram.WebApp;
const APP_V = '12.11f';  // версия файла — видно в шапке, чтобы отличать кэш от свежей
const CS = TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9') ? TG.CloudStorage : null;
const PART = 4000;
const K_EX='exlib', K_TPL='tpls', K_DAYS='days', K_DRAFT='draft3';   // ключи v3 (старые ex/tpl/idx/cur от v1–v2 не трогаем)
const LS = { get(k){ try{ return localStorage.getItem('allina_'+k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem('allina_'+k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem('allina_'+k); }catch(e){} } };
const pref = { get(k,d){ try{ const v=localStorage.getItem('allina_p_'+k); return v==null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('allina_p_'+k,v); }catch(e){} } };
function rawGet(keys){ if(!keys.length) return Promise.resolve({});
  if(!CS){ const o={}; keys.forEach(k=>o[k]=LS.get(k)||''); return Promise.resolve(o); }
  return new Promise((res,rej)=>CS.getItems(keys,(err,v)=>err?rej(err):res(v||{}))); }
function rawSet(k,v){ if(!CS){ LS.set(k,v); return Promise.resolve(); } return new Promise((res,rej)=>CS.setItem(k,v,err=>err?rej(err):res())); }
function rawDel(keys){ if(!keys.length) return Promise.resolve(); if(!CS){ keys.forEach(k=>LS.del(k)); return Promise.resolve(); }
  return new Promise((res,rej)=>CS.removeItems(keys,err=>err?rej(err):res())); }
async function getJ(key, def){ const v=(await rawGet([key]))[key]; if(!v) return def; let s=v;
  if(v.charAt(0)==='§'){ const n=+v.slice(1), ks=[]; for(let i=1;i<=n;i++) ks.push(key+'__'+i); const p=await rawGet(ks); s=ks.map(k=>p[k]||'').join(''); }
  try{ return JSON.parse(s); }catch(e){ return def; } }
async function setJ(key, obj){ const s=JSON.stringify(obj); if(s.length<=PART) return rawSet(key,s);
  const n=Math.ceil(s.length/PART); for(let i=1;i<=n;i++) await rawSet(key+'__'+i, s.slice((i-1)*PART,i*PART)); return rawSet(key,'§'+n); }
async function delJ(key){ const v=(await rawGet([key]))[key]; const ks=[key]; if(v && v.charAt(0)==='§') for(let i=1;i<=+v.slice(1);i++) ks.push(key+'__'+i); return rawDel(ks); }
function hap(t){ try{ TG && TG.HapticFeedback && (t==='ok'?TG.HapticFeedback.notificationOccurred('success'):TG.HapticFeedback.selectionChanged()); }catch(e){} }
function toast(m,ms){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display='none',ms||2400); }
// в Telegram confirm() может молча не работать — берём его собственное окно
function ask(msg){ return new Promise(res=>{ try{ if(TG && TG.showConfirm && TG.isVersionAtLeast('6.2')) return TG.showConfirm(msg, ok=>res(!!ok)); }catch(e){} res(window.confirm(msg)); }); }

/* ================= тема: авто / светлая / тёмная / как в Telegram ================= */
const THEMES=[['auto','Авто'],['light','Светлая'],['dark','Тёмная'],['tg','Telegram']];
let THEME=pref.get('theme','auto');
function tgDark(){ try{ if(TG && TG.colorScheme) return TG.colorScheme==='dark'; }catch(e){} return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function applyTheme(){
  const t = THEME==='auto' ? (tgDark()?'dark':'light') : THEME;
  document.documentElement.setAttribute('data-theme', t);
  try{ const bg=getComputedStyle(document.body).backgroundColor; if(TG && TG.isVersionAtLeast && TG.isVersionAtLeast('6.1')){ TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } }catch(e){}
  const m=$('thm'); if(m) m.innerHTML=THEMES.map(([k,l])=>'<button data-th="'+k+'" class="'+(THEME===k?'on':'')+'">'+l+'</button>').join('');
}
async function setTheme(k){ THEME=k; pref.set('theme',k); applyTheme(); try{ await rawSet('theme',k); }catch(e){} }
try{ TG && TG.onEvent && TG.onEvent('themeChanged', ()=>{ if(THEME==='auto'||THEME==='tg') applyTheme(); }); }catch(e){}
applyTheme();

  'Кг на бирке — от слабого до полного растяжения. Реальная нагрузка зависит от того, насколько резина растянута в точке движения.',
  '(х2) — двойная намотка: натяжение по всей амплитуде. Это ТЯЖЕЛЕЕ, а не легче.',

// история зашифрована: ключ = PBKDF2(её Telegram ID). Не её аккаунт → не расшифруется, перенос отмечается сделанным и больше не пробуется.
async function seedOpen(txt){
  let o; try{ o=JSON.parse(txt); }catch(e){ return null; }
  if(!o || !o.ct) return o && o.log ? o : null;
  const uid = TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.id;
  if(!uid || !(window.crypto && crypto.subtle)) return null;              // вне Telegram — ничего не трогаем
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode('allina-seed:' + uid), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:b(o.salt), iterations:o.it}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(o.iv)}, key, b(o.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ if(e && e.name==='OperationError'){ try{ await rawSet('seeded1','1'); }catch(er){} } return null; }
}

// ── следующий шаг нагрузки: самая маленькая прибавка из реальных резинок (каждая в одном экземпляре)
const STEP_ORDER = ['ЭТ', 'С-Я', 'К1', 'К2', 'Ч', 'Ф', 'З'];
const STEP_KG = {'ЭТ': 6, 'С-Я': 7, 'К1': 15, 'К2': 25, 'Ч': 29, 'Ф': 39, 'З': 59};
function parseLoad(load) {
  const up = String(load || '').toUpperCase().replace(/Х/g, 'X').replace(/\s*\(\s*X\s*2\s*\)/g, '(X2)').replace(/С\s*-?\s*Я/g, 'С-Я');
  const g = up.match(/ГФ\s*(\d+(?:[.,]\d+)?)/), gf = g ? g[1].replace(',', '.') : '';
  const rest = up.replace(/ГФ\s*\d+(?:[.,]\d+)?/, ' ');
  const km = rest.match(/(\d+(?:[.,]\d+)?)\s*КГ/);
  const bands = [];
  rest.split(/[+\s,]+/).forEach(t => { const m = t.match(/^(ЭТ|С-Я|С|К1|К2|Ч|Ф|З)(\(X2\))?$/); if (m) bands.push({c: m[1] === 'С' ? 'С-Я' : m[1], x2: !!m[2]}); });
  return {gf, kg: km ? parseFloat(km[1].replace(',', '.')) : null, bands};
}
const stepKg = bs => bs.reduce((a, b) => a + STEP_KG[b.c] * (b.x2 ? 2 : 1), 0);
const stepFmt = (gf, bs) => { const b = bs.slice().sort((x, y) => STEP_KG[y.c] - STEP_KG[x.c]).map(x => x.c + (x.x2 ? '(х2)' : '')).join('+'); return gf ? 'ГФ ' + gf + (b ? ' + ' + b : '') : b; };
function nextStep(load) {
  const P = parseLoad(load), num = x => String(+x.toFixed(1)).replace('.', ',');
  if (String(load || '').trim() && !P.bands.length && !P.gf && P.kg == null) return {to: '', alt: '', why: 'нагрузка не из шкалы резин — шаг подбери сама: следующая по тяжести резинка или +2–3 повтора'};
  if (P.kg != null && !P.bands.length && !P.gf) { const s = P.kg < 10 ? 1 : 2.5; return {to: num(P.kg + s) + ' кг', alt: '', why: '+' + num(s) + ' кг'}; }
  if (!P.bands.length) return {to: stepFmt(P.gf, [{c: 'С-Я', x2: false}]), alt: stepFmt(P.gf, [{c: 'К1', x2: false}]), why: P.gf ? 'к грифу добавь самую лёгкую резину (1–7 кг)' : 'самая лёгкая резина поверх своего веса (1–7 кг)'};
  const used = new Set(P.bands.map(b => b.c)), cur = stepKg(P.bands), anyX2 = P.bands.some(b => b.x2), C = [];
  // ЭТ (трубка с ручками) не предлагаем — неудобна (его слова 11.11)
  if (P.bands.length < 3) STEP_ORDER.forEach(c => { if (!used.has(c) && c !== 'ЭТ') C.push(P.bands.concat([{c, x2: false}])); });
  P.bands.forEach((b, i) => { for (let j = STEP_ORDER.indexOf(b.c) + 1; j < STEP_ORDER.length; j++) { const c = STEP_ORDER[j]; if (used.has(c) || c === 'ЭТ') continue; const nb = P.bands.slice(); nb[i] = {c, x2: b.x2}; C.push(nb); break; } });
  if (!anyX2) STEP_ORDER.forEach(c => { if (c !== 'ЭТ') C.push([{c, x2: false}]); });
  const cost = bs => stepKg(bs);
  const seen = new Set(), ok = C.filter(bs => stepKg(bs) > cur).map(bs => ({bs, k: stepKg(bs), c: cost(bs), s: stepFmt(P.gf, bs)}))
    .filter(x => !seen.has(x.s) && seen.add(x.s)).sort((a, b) => a.c - b.c);
  if (!ok.length) return {to: '', alt: '', why: 'резины на пределе — дальше медленный негатив 3 с или пауза внизу'};
  const a = ok[0], tot = cur + (parseFloat(P.gf) || 0);  // для процента считаем и гриф
  const b = ok.find(x => x.k > a.k + 0.5) || null, pct = tot ? Math.round((a.k - cur) / tot * 100) : 0;
  // прыжок больше 40% (дельты, руки на лёгких резинах): сначала выжать больше из текущей
  const big = pct > 40 ? '. Прыжок большой — можно сначала остаться на текущей: +2–3 повтора сверх диапазона или негатив 3 с' : '';
  return {to: a.s, alt: b ? b.s : '', why: '≈ +' + num(a.k - cur) + ' кг по биркам' + (pct ? ', +' + pct + '%' : ''), big};
}
const stepTxt = load => {
  if (String(load || '').includes('/')) return 'Шаг по подходам: ' + String(load).split('/').map((p, i) => { p = p.trim(); const n = nextStep(p); return (i + 1) + ') ' + (p || 'свой вес') + ' → ' + (n.to || 'сама'); }).join('; ');
  const n = nextStep(load), cur = load && String(load).trim() ? String(load).trim() : 'свой вес';
  return n.to ? 'Шаг: ' + cur + ' → ' + n.to + ' (' + n.why + ')' + (n.alt ? '. Следующий после него — ' + n.alt : '') + (n.big || '') : n.why; };

function progHint(n, rr, before){

  const same=[]; for(let i=R.length-1;i>=0 && lk(R[i])===lk(last);i--) same.unshift(R[i]);

  return {cls:'', txt:'Цель сегодня: '+sets.map(v=>v>=hi?v:Math.min(hi,v+1)).join(', ')+'. По +1 повтору, пока не будет '+hi+' в каждом подходе'};
}

/* ================= Прогресс ================= */
function tplReps(n){ for(const t of TPL) for(const e of t.ex||[]) if(e.n===n && e.reps) return e.reps; return ''; }
function gymProg(){
  const all=rowsAll(), freq={}; all.forEach(x=>{ freq[x.ex]=(freq[x.ex]||0)+1; });
  const names=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]);
  if(!names.length) return '<div class="sub">Пока нет записей. Сохрани первую тренировку в «＋ Новая» — здесь появится график и рекорды.</div>';
  if(!gEx || !freq[gEx]) gEx=names[0];
  const rows=all.filter(x=>x.ex===gEx), rr=tplReps(gEx), n=rows.length, last=rows[n-1];
  const ph=progHint(gEx, rr), tip=ph?'<span class="'+ph.cls+'">'+esc(ph.txt)+'</span>':'';
  const W=520,Hh=170,P=26, vals=rows.map(sumR), mx=Math.max(10,...vals)*1.15;
  const X=i=>P+(n<2?(W-P)/2:i/(n-1)*(W-P-10)), Yv=v=>10+(1-v/mx)*(Hh-40);
  let path='', marks='', prev=null;
  rows.forEach((x,i)=>{ path+=(i?'L':'M')+X(i).toFixed(1)+' '+Yv(vals[i]).toFixed(1);
    marks+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Yv(vals[i]).toFixed(1)+'" r="3.4" style="fill:var(--acc)"/>';
    const nl=lk(x); if(nl!==prev){ marks+='<line x1="'+X(i).toFixed(1)+'" x2="'+X(i).toFixed(1)+'" y1="10" y2="'+(Hh-30)+'" stroke="#d9822b" stroke-dasharray="2 3" opacity=".7"/><text x="'+(X(i)>W-70?X(i)-3:X(i)+3).toFixed(1)+'" y="'+(Hh-32)+'" fill="#d9822b" font-size="10"'+(X(i)>W-70?' text-anchor="end"':'')+'>'+esc(loadTxt(x.load).slice(0,14))+'</text>'; prev=nl; } });
  if(gPi==null || gPi<0 || gPi>=n) gPi=n-1;
  const sx=X(gPi).toFixed(1), sy=Yv(vals[gPi]).toFixed(1);
  marks+='<line x1="'+sx+'" x2="'+sx+'" y1="10" y2="'+(Hh-30)+'" style="stroke:var(--acc)" opacity=".3"/><circle cx="'+sx+'" cy="'+sy+'" r="7" fill="none" style="stroke:var(--acc)" stroke-width="2"/>';
  const svg='<svg class="chart" id="g-chart" data-n="'+n+'" data-w="'+W+'" data-p="'+P+'" viewBox="0 0 '+W+' '+Hh+'"><line x1="'+P+'" x2="'+W+'" y1="'+(Hh-30)+'" y2="'+(Hh-30)+'" style="stroke:var(--axis)"/>'+marks+'<path d="'+path+'" fill="none" style="stroke:var(--acc)" stroke-width="2.4"/><text x="'+P+'" y="'+(Hh-10)+'" style="fill:var(--hint)" font-size="11">'+dmy(rows[0].d)+'</text><text x="'+W+'" y="'+(Hh-10)+'" style="fill:var(--hint)" font-size="11" text-anchor="end">'+dmy(last.d)+'</text><text x="0" y="16" style="fill:var(--hint)" font-size="10">повт.</text></svg>';
  const pk=rows[gPi];
  const pick='<div class="pick"><div class="row"><b>'+esc(wd(pk.d))+', '+esc(dmy(pk.d))+'</b><span class="sub">'+esc(pk.tpl||'')+'</span></div><div>'+esc(lsTxt(pk.load,pk.s))+esc(rpeShow(pk.rpe))+'</div>'+(pk.note?'<div class="nt">'+esc(pk.note)+'</div>':'')+'</div>';
  let top=0; rows.forEach((x,i)=>{ if(vals[i]>=vals[top]) top=i; });
  const per={}; rows.forEach((x,i)=>{ const k=lk(x), c=per[k]; if(!c || vals[i]>=vals[c.i]) per[k]={i}; });
  const perL=Object.values(per).sort((a,b)=>loadScore(rows[b.i].load)-loadScore(rows[a.i].load));
  let hv=0; rows.forEach((x,i)=>{ const d=loadScore(x.load)-loadScore(rows[hv].load); if(d>0 || (d===0 && vals[i]>=vals[hv])) hv=i; });
  const hx=rows[hv], tx=rows[top];
  const best='<div class="best"><b>🏆 Лучшее за всё время</b>'
    +'<div class="top" data-pi="'+hv+'">🏋️ Самая тяжёлая нагрузка: <b>'+esc(lsTxt(hx.load,hx.s))+'</b>'+' · '+esc(dmy(hx.d))+'</div>'
    +'<div class="top" data-pi="'+top+'">🔁 Больше всего повторов: <b>'+esc(lsTxt(tx.load,tx.s))+'</b>'+' · '+esc(dmy(tx.d))+'</div>'
    +(perL.length>1?'<details id="g-best"'+(gBest?' open':'')+'><summary>Рекорд на каждой нагрузке · '+perL.length+' ▾</summary><div class="sub">сверху — самая тяжёлая; (х2) тяжелее любой обычной намотки, дальше — по кг с бирок</div><ul class="pl">'+perL.map(c=>{ const x=rows[c.i]; return '<li data-pi="'+c.i+'"><span>'+esc(loadTxt(x.load))+'</span><span>'+esc(setStr(x))+'</span><span class="sub">'+esc(dmy(x.d))+'</span></li>'; }).join('')+'</ul></details>':'')+'</div>';
  const li=i=>{ const x=rows[i]; return '<li data-pi="'+i+'" class="'+(i===gPi?'on':'')+'"><span>'+esc(dmy(x.d))+'</span><span>'+esc(loadTxt(x.load))+'</span><span class="sub">'+esc(setStr(x))+(x.rpe?' · '+esc(x.rpe):'')+'</span></li>'; };
  const idx=rows.map((x,i)=>i).reverse();
  return '<select id="g-ex">'+names.map(nm=>'<option'+(nm===gEx?' selected':'')+'>'+esc(nm)+'</option>').join('')+'</select>'
    +'<div class="row" style="margin-top:8px"><span>последний раз <b>'+esc(lsTxt(last.load,last.s))+'</b></span><span class="sub">'+esc(dmy(last.d))+'</span></div>'
    +(rr?'<div class="sub" style="margin-top:4px">диапазон '+esc(rr)+' · '+tip+'</div>':'')
    +svg+'<div class="sub">Линия — сумма повторов за тренировку, оранжевым — смена резины/веса. Тапни по графику — покажу ту тренировку.</div>'
    +pick+best
    +'<div class="sub" style="margin-top:10px">История · '+n+' '+plural(n,'запись','записи','записей')+'</div><ul class="pl">'+li(idx[0])+'</ul>'
    +(n>1?'<details id="g-hist"'+(gHist?' open':'')+'><summary>Все даты с '+esc(dmy(rows[0].d))+' ▾</summary><ul class="pl">'+idx.slice(1).map(li).join('')+'</ul></details>':'');
}

    if(!(await ask(o.v>=4 ? 'Восстановить копию от '+(o.at?dmy(o.at):'?')+'? Заменятся шаблоны, упражнения, цели, продукты, рецепты, вес, шаги, замеры и еда за недели из копии; тренировки из копии добавятся к текущим.' : 'Восстановить копию? Шаблоны и упражнения заменятся, тренировки из копии добавятся к текущим.'))) return;
    await restoreAll(o); toast('Восстановлено'); renderGym(); return; }
  if(b.dataset && b.dataset.snap){ const o=await getJ(b.dataset.snap,null); if(!o) return toast('Снимок не читается');
    if(!(await ask('Вернуть всё как было '+dmy(o.at)+'? Текущие вес, шаги, замеры, продукты, цели и еда за эти недели заменятся снимком; тренировки из снимка добавятся.'))) return;
    await restoreAll(o); toast('Вернула снимок от '+dmy(o.at)); renderGym(); return; }
  // мышцы
  if(d.gmv){ gmv=d.gmv; renderGym(); return; }
  if(d.ms!==undefined){ gMs = gMs===d.ms ? '' : d.ms; renderGym(); return; }
  if(d.mused!==undefined){ musEd=d.mused; renderGym(); window.scrollTo(0,0); return; }
  if(d.musback){ musEd = musEd ? '' : null; renderGym(); return; }
  if(d.mset){ let e=exInfo(musEd); if(!e){ e={n:musEd, mus:{}}; EX.push(e); } e.mus=e.mus||{}; const c=+d.c; if(c) e.mus[d.mset]=c; else delete e.mus[d.mset]; await setJ(K_EX,EX); renderGym(); hap(); return; }
});
$('tabs').addEventListener('click', e=>{ const b=e.target.closest('button[data-gv]'); if(!b) return; readDom(); if(gv==='new') saveDraft(true); if(b.dataset.gv==='kb'){ kbv=''; tplEd=null; } if(b.dataset.gv==='mus') musEd=null; if(b.dataset.gv!=='cal') SUMMARY=null; gv=b.dataset.gv; pref.set('gv',gv); renderGym(); hap(); window.scrollTo(0,0); });
$('thbtn').onclick=()=>{ $('thm').classList.toggle('open'); hap(); };
$('thm').onclick=e=>{ const b=e.target.closest('button[data-th]'); if(!b) return; setTheme(b.dataset.th); hap(); };
$('nav').onclick=e=>{ const b=e.target.closest('button[data-tab]'); if(!b) return; if(TAB==='gym'){ readDom(); if(gv==='new') saveDraft(true); } TAB=b.dataset.tab; pref.set('tab',TAB); render(); window.scrollTo(0,0); hap(); };

/* ================= старт ================= */
(async()=>{
  try{ TG && TG.ready(); TG && TG.expand(); }catch(e){}
  try{ await load(); }catch(e){ $('app').innerHTML='<div class="card">Не удалось загрузить данные: '+esc(e&&e.message||e)+'</div>'; return; }
  render();
  if(SEEDED) toast('Перенесла прошлые тренировки: '+SEEDED+' — смотри «Календарь» и «Прогресс»', 4500);
  setInterval(()=>{ const m=$('w-mins'); if(m && DRAFT && !DRAFT.editing) m.textContent=DRAFT.t1?Math.round((Date.now()-DRAFT.t1)/60000)+' мин':''; }, 30000);
})();
</script>
